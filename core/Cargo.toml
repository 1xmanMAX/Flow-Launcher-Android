[workspace]
members = ["flow-core", "plugins/texto", "plugins/pixpin"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# QuickJS es C y casi todo el peso del motor de JavaScript: compilado para
# ocupar poco: ~790 KB en arm64 en vez de ~1,2 MB, y una consulta tipica
# sigue por debajo de 0,1 ms.
[profile.release.package.rquickjs-sys]
opt-level = "z"
